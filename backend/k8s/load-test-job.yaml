apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: load-test
        image: myapp-backend:latest
        imagePullPolicy: Never
        command: ["python", "k8s_load_test.py"]
        env:
        - name: TARGET_ADDR
          value: "dns:///prediction-service:50051"
